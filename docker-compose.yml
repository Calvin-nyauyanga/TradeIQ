services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tradeiq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeiq_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tradeiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradeiq-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: